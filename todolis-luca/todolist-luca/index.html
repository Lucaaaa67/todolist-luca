<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list app - practica de laboratorio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="to-do-app">
            <h2>Lista de tareas <img src="img/pepe.jpg" alt="Icono de tareas"></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Añade tu tarea aqui...">
                <button onclick="addTask()" >Añadir</button>
            </div>
            <ul id="list-container">
                <!-- las tareas agreagdas dinamicamentemediante javascript apareceran aqui -->
            </ul>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
